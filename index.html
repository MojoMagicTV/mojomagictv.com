<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MojoMagicTV, Coming Soon</title>
<meta name="description" content="MojoMagicTV's new home on the web is coming soon. Catch the streams on Twitch and YouTube, and grab merch in the meantime." />
<meta name="theme-color" content="#16181f" />
<meta property="og:title" content="MojoMagicTV, Coming Soon" />
<meta property="og:description" content="MojoMagicTV's new home on the web is coming soon." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23F2C500'/><text x='16' y='23' font-family='Arial Black,Arial' font-weight='900' font-size='17' text-anchor='middle' fill='%23111'>M</text></svg>" />
<link rel="preload" href="assets/fonts/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <!-- Background: replace assets/bg.webp with the final wallpaper (same filename). -->
  <picture>
    <source media="(max-aspect-ratio: 3/4), (max-width: 640px)" srcset="assets/bg_mobile.webp" />
    <img class="bg" src="assets/bg.webp" alt="" aria-hidden="true" decoding="async" />
  </picture>
  <div class="shade" aria-hidden="true"></div>
  <main class="wrap">
    <h1 class="title"><span class="wordmark" role="img" aria-label="MojoMagicTV"><span class="wordmark__main" aria-hidden="true">MOJO<span class="wordmark__magic">MAGIC</span></span><span class="wordmark__tv" aria-hidden="true">TV</span></span></h1>
    <p class="sub">Coming Soon</p>
    <!-- Go-live countdown: fixed end = start + 50 days. Do not recompute a rolling 50 days. -->
    <div class="countdown" id="countdown" role="timer" aria-live="polite" aria-atomic="true"
         data-start="2026-11-06T00:20:19-05:00"
         data-end="2026-12-26T00:20:19-05:00">
      <div class="countdown__unit"><span class="countdown__num" data-part="days">50</span><span class="countdown__label">Days</span></div>
      <div class="countdown__unit"><span class="countdown__num" data-part="hours">00</span><span class="countdown__label">Hours</span></div>
      <div class="countdown__unit"><span class="countdown__num" data-part="mins">00</span><span class="countdown__label">Mins</span></div>
      <div class="countdown__unit"><span class="countdown__num" data-part="secs">00</span><span class="countdown__label">Secs</span></div>
    </div>
    <nav class="links" aria-label="MojoMagicTV links">
      <a class="btn" href="https://twitch.tv/mojomagictv" target="_blank" rel="noopener">Twitch</a>
      <a class="btn" href="https://www.youtube.com/@MoJoMagicTV" target="_blank" rel="noopener">YouTube</a>
      <a class="btn" href="https://mojo-shop.fourthwall.com" target="_blank" rel="noopener">Merch</a>
    </nav>
  </main>
  <script>
  (function () {
    var root = document.getElementById('countdown');
    if (!root) return;
    var endMs = Date.parse(root.getAttribute('data-end'));
    if (!isFinite(endMs)) return;
    var daysEl = root.querySelector('[data-part="days"]');
    var hoursEl = root.querySelector('[data-part="hours"]');
    var minsEl = root.querySelector('[data-part="mins"]');
    var secsEl = root.querySelector('[data-part="secs"]');
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    function tick() {
      var left = endMs - Date.now();
      if (left <= 0) {
        root.outerHTML = '<p class="countdown__live" role="status">Going live</p>';
        return;
      }
      var totalSec = Math.floor(left / 1000);
      var days = Math.floor(totalSec / 86400);
      var hours = Math.floor((totalSec % 86400) / 3600);
      var mins = Math.floor((totalSec % 3600) / 60);
      var secs = totalSec % 60;
      daysEl.textContent = String(days);
      hoursEl.textContent = pad(hours);
      minsEl.textContent = pad(mins);
      secsEl.textContent = pad(secs);
      setTimeout(tick, 1000);
    }
    tick();
  })();
  </script>
</body>
</html>
