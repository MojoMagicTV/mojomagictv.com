  <script>
  (function () {
    var root = document.getElementById('countdown');
    if (!root) return;
    var endMs = Date.parse(root.getAttribute('data-end'));
    if (!isFinite(endMs)) return;
    var daysEl = root.querySelector('[data-part="days"]');
    var hoursEl = root.querySelector('[data-part="hours"]');
    var minsEl = root.querySelector('[data-part="mins"]');
    var secsEl = root.querySelector('[data-part="secs"]');
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    function tick() {
      var left = endMs - Date.now();
      if (left <= 0) {
        root.outerHTML = '<p class="countdown__live" role="status">Going live</p>';
        return;
      }
      var totalSec = Math.floor(left / 1000);
      var days = Math.floor(totalSec / 86400);
      var hours = Math.floor((totalSec % 86400) / 3600);
      var mins = Math.floor((totalSec % 3600) / 60);
      var secs = totalSec % 60;
      daysEl.textContent = String(days);
      hoursEl.textContent = pad(hours);
      minsEl.textContent = pad(mins);
      secsEl.textContent = pad(secs);
      setTimeout(tick, 1000);
    }
    tick();
  })();
  </script>
  <script>
  (function () {
    var video = document.querySelector('[data-video]');
    var poster = document.querySelector('[data-poster]');
    var fallback = document.querySelector('[data-fallback]');
    var live = document.querySelector('[data-live]');
    if (!video) return;
    function say(text) { if (live) live.textContent = text; }
    function showFallback() {
      video.hidden = true;
      video.dataset.state = 'error';
      if (poster) poster.hidden = false;
      if (fallback) fallback.hidden = false;
      say('Preview image shown. The trailer did not play.');
    }
    function tryPlay() {
      var pending = video.play();
      if (pending && pending.catch) pending.catch(function () {});
    }
    video.muted = true;
    video.defaultMuted = true;
    video.loop = true;
    video.playsInline = true;
    video.volume = 0;
    video.addEventListener('playing', function () {
      video.dataset.state = 'playing';
      if (poster) poster.hidden = true;
      if (fallback) fallback.hidden = true;
    });
    video.addEventListener('error', showFallback);
    if (video.error) showFallback();
    else tryPlay();
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) video.pause();
      else if (!video.hidden) tryPlay();
    });
  })();
  </script>
  <script>
  (function () {
    var stage = document.querySelector('[data-stage]');
    var video = document.querySelector('[data-video]');
    if (!stage) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var from = parseFloat(stage.getAttribute('data-zoom-from')) || 1;
    var to = parseFloat(stage.getAttribute('data-zoom-to')) || 1.11;
    var cycle = (parseFloat(stage.getAttribute('data-zoom-cycle-ms')) || 15000) / 1000;
    var active = (parseFloat(stage.getAttribute('data-zoom-active-ms')) || 0) / 1000;  // zoom rests at scale 1 after this (the video's own camera return runs then)
    var total = (parseFloat(stage.getAttribute('data-video-ms')) || 60000) / 1000;
    stage.setAttribute('data-zoom-sync', '');
    var lastT = 0, anchor = null, started = false, t0 = performance.now();
    function clock() {
      // Normal: the video's own clock. A momentary stall/seek (readyState < 2, e.g. at the loop point) holds the last
      // value so the zoom stays phase-locked. Only if the video failed/is hidden do we advance on a wall clock from
      // the last known video time, wrapped to the same 60s loop.
      if (video && video.readyState >= 2) started = true;
      // video never became playable within 2s (blocked / unsupported): treat as failed -> wall-clock fallback
      if (video && !video.hidden && !video.error && (started || performance.now() - t0 < 2000)) {
        anchor = null;
        if (video.readyState >= 2 || video.currentTime > 0) lastT = video.currentTime;
        return lastT;
      }
      if (anchor === null) anchor = performance.now() - lastT * 1000;
      return ((performance.now() - anchor) / 1000) % total;
    }
    function frame() {
      var c = clock();
      var t = (active > 0 && c >= active) ? 0 : c % cycle;
      var k = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / cycle);
      stage.style.transform = 'scale(' + (from + (to - from) * k).toFixed(5) + ')';
      window.requestAnimationFrame(frame);
    }
    frame();
  })();
  </script>
